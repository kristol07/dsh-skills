name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm ci` runs `prepare`, which is also the closest rehearsal of what a
      # git install does to a consumer.
      - run: npm ci
      - run: npm test
      - run: npm run verify:pack
      - run: npm pack --dry-run
